site_name: Sistema de Gestão da Granja da Sogra
site_description: Documentação de arquitetura e regras de negócio do Sistema de Gestão da Granja

theme:
  name: material
  language: pt-BR
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - content.code.copy

nav:
  - Início: index.md
  - Arquitetura: arquitetura.md
  - Regra de Negócio / Fluxo: regra-de-negocio.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format